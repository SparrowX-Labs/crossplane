database:
  enabled: true
  type: postgres
  name: "customerdb"
  instanceClass: db.t4g.micro
  allocatedStorage: 20
  backupRetentionPeriod: 1
  multiAZ: false
  username: postgres_admin
  secretsManager:
    enabled: true
    name: "customerdb-secret"
    passwordSourceSecretKey: password

s3:
  enabled: false
